services:
  backend:
    build: ./backend
    environment:
      APP_ENV: docker
      SECRET_KEY: local-compose-secret-change-me
      DATABASE_URL: postgresql+psycopg://carpenter:carpenter_local@postgres:5432/carpenter_partner
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carpenter_partner
      POSTGRES_USER: carpenter
      POSTGRES_PASSWORD: carpenter_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
