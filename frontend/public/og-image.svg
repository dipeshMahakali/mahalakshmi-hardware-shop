<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="60%" stop-color="#0E1013" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F47B20" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Showroom Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Architectural Background Grid -->
  <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Amber Ambient Radial Glow -->
  <circle cx="600" cy="180" r="320" fill="#F47B20" opacity="0.07" filter="url(#shadow)" />

  <!-- Badge Pill -->
  <g transform="translate(600, 110)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(244, 123, 32, 0.12)" stroke="#F47B20" stroke-width="1.5" />
    <text text-anchor="middle" y="6" fill="#F47B20" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
      ARCHITECTURAL HARDWARE SHOWROOM
    </text>
  </g>

  <!-- Main Headline -->
  <text text-anchor="middle" x="600" y="225" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    Shri Mahalakshmi Trader
  </text>

  <text text-anchor="middle" x="600" y="285" fill="url(#gold)" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
    Digital Smart Locks &amp; Designer Door Fittings
  </text>

  <!-- Narrative Description -->
  <text text-anchor="middle" x="600" y="340" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    5,000+ Curated Products • Biometric Locks • Luxury Mortise Handles • Soft-Close Hinges
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(180, 410)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="260" height="110" rx="12" fill="#14171D" stroke="rgba(255,255,255,0.1)" />
    <circle cx="35" cy="38" r="16" fill="rgba(244,123,32,0.15)"/>
    <text x="35" y="44" fill="#F47B20" text-anchor="middle" font-size="18">🔒</text>
    <text x="65" y="42" fill="#FFFFFF" font-family="system-ui" font-size="16" font-weight="700">Biometric Security</text>
    <text x="25" y="80" fill="#94A3B8" font-family="system-ui" font-size="13">Smart keyless digital locks</text>

    <!-- Card 2 -->
    <rect x="290" y="0" width="260" height="110" rx="12" fill="#14171D" stroke="rgba(255,255,255,0.1)" />
    <circle cx="325" cy="38" r="16" fill="rgba(212,175,55,0.15)"/>
    <text x="325" y="44" fill="#D4AF37" text-anchor="middle" font-size="18">✨</text>
    <text x="355" y="42" fill="#FFFFFF" font-family="system-ui" font-size="16" font-weight="700">Designer Handles</text>
    <text x="315" y="80" fill="#94A3B8" font-family="system-ui" font-size="13">Solid forged brass &amp; zinc</text>

    <!-- Card 3 -->
    <rect x="580" y="0" width="260" height="110" rx="12" fill="#14171D" stroke="rgba(255,255,255,0.1)" />
    <circle cx="615" cy="38" r="16" fill="rgba(16,185,129,0.15)"/>
    <text x="615" y="44" fill="#10B981" text-anchor="middle" font-size="18">⚡</text>
    <text x="645" y="42" fill="#FFFFFF" font-family="system-ui" font-size="16" font-weight="700">Wholesale Trade</text>
    <text x="605" y="80" fill="#94A3B8" font-family="system-ui" font-size="13">Direct contractor &amp; site pricing</text>
  </g>

  <!-- Footer Showroom Contact Bar -->
  <g transform="translate(600, 580)">
    <text text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="15">
      📞 +91 95261 62225  •  📍 Near Bharat Petrol Pump, Bagbahara, Chhattisgarh  •  🌐 shrimahalakshmitrader.com
    </text>
