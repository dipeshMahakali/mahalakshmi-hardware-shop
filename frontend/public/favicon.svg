<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2024" />
      <stop offset="100%" stop-color="#0E1013" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F47B20" />
      <stop offset="100%" stop-color="#D9630D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <polygon points="60,6 108,22 108,82 60,114 12,82 12,22" fill="url(#shieldGrad)" stroke="url(#orangeGrad)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Architectural Geometric Key & Lock Emblem -->
  <!-- Outer Gold Hexagon -->
  <polygon points="60,26 88,40 88,72 60,86 32,72 32,40" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Inner Hardware Hub & Handle Line -->
  <circle cx="60" cy="52" r="12" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.95"/>
  <circle cx="60" cy="52" r="5" fill="url(#orangeGrad)"/>
  
  <!-- Mortise Handle Bolt / Stem -->
  <path d="M60 64 L60 84" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M53 76 L67 76" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M55 83 L65 83" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Subtle Diamond Accents -->
  <polygon points="60,14 63,18 60,22 57,18" fill="url(#goldGrad)"/>
</svg>
